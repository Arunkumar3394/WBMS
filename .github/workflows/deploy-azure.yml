# Builds the website package and uploads it to Azure App Service.
# Run it from the Actions tab ("Deploy to Azure" > "Run workflow"). Setup: deploy/DEPLOY.md, option B.
name: Deploy to Azure

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Azure settings
        shell: bash
        env:
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if [ -z "$APP_NAME" ] || [ -z "$PROFILE" ]; then
            echo "::error::Add the AZURE_WEBAPP_NAME variable and the AZURE_WEBAPP_PUBLISH_PROFILE secret (see deploy/DEPLOY.md, option B)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/wbms-web/package-lock.json

      - name: Build the Angular site
        working-directory: src/wbms-web
        run: |
          npm ci
          npm run build

      - name: Build the site package
        run: dotnet msbuild -restore src/Wbms.Api47 -t:PublishSite -p:Configuration=Release -v:minimal

      - name: Upload to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish/site
